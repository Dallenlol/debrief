[package]
name = "hark-capture"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
cpal = "0.18"
hound = "3.5"
crossbeam-channel.workspace = true
parking_lot.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi",
  "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
# Same versions cpal uses for its own Core Audio tap, so nothing is built twice.
objc2 = "0.6"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-foundation = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSValue", "NSUUID"] }
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
